name: Build fast signed APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;25.2.9519653" "cmake;3.22.1"

      - name: Download Gradle 8.7
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle-8.7-bin.zip
          echo "$PWD/gradle-8.7/bin" >> "$GITHUB_PATH"

      - name: Build optimized release APK
        run: |
          unzip -q BlackboxOffline_WHISPER_COMPACT.zip
          cd BlackboxOffline_WHISPER_COMPACT
          gradle assembleRelease --no-daemon

      - name: Sign release APK
        run: |
          BUILD_TOOLS="$ANDROID_SDK_ROOT/build-tools/35.0.0"
          APK="BlackboxOffline_WHISPER_COMPACT/app/build/outputs/apk/release/app-release-unsigned.apk"
          keytool -genkeypair -keystore release-key.jks -storepass blackbox2026 -keypass blackbox2026 -alias blackbox -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Blackbox Offline, OU=Personal, O=Blackbox, L=Local, ST=Local, C=RU"
          "$BUILD_TOOLS/zipalign" -f -p 4 "$APK" app-release-aligned.apk
          "$BUILD_TOOLS/apksigner" sign --ks release-key.jks --ks-key-alias blackbox --ks-pass pass:blackbox2026 --key-pass pass:blackbox2026 --out BlackboxOffline-release.apk app-release-aligned.apk
          "$BUILD_TOOLS/apksigner" verify --verbose BlackboxOffline-release.apk

      - name: Upload signed optimized APK
        uses: actions/upload-artifact@v4
        with:
          name: BlackboxOffline-fast-signed-APK
          path: BlackboxOffline-release.apk
          if-no-files-found: error
